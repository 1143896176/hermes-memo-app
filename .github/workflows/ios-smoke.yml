name: iOS 模拟器冒烟测试

# 这条流水线回答的问题不是「能不能编出来」，而是「装上去到底能不能跑起来」。
#
# 与 ios-simulator.yml 的分工：
#   ios-simulator.yml  → 只产出 .app 包（给 Appetize / 本地 Xcode 用）
#   ios-smoke.yml      → 在 runner 上真 boot 一个模拟器，装进去、启动、观察，
#                        然后按四个信号判定是否通过
#
# 四个判定信号：
#   1. 进程活着        启动后 app 进程退出 = 闪退（含权限缺失导致的进程被系统杀掉）
#   2. 没有崩溃报告    ~/Library/Logs/DiagnosticReports 里没有本次新增的 App-*.ips
#   3. Node 起来了     stdout 里出现 [hermes-node]，且 node:sqlite 可用
#   4. 首屏不是白屏    scripts/sim_screenshot_check.py 统计截图颜色种数与亮度标准差
#
# 明确验不了：语音识别（模拟器没有麦克风输入，SFSpeechRecognizer 在模拟器上不可靠）、
# 相机、真实性能。这些只能真机侧载。
#
# 手动触发，不进 push 自动流程，避免每次提交都多烧一轮 macOS 分钟：
#   gh workflow run ios-smoke.yml        （或网页 Actions 页面点 Run workflow）

on:
  workflow_dispatch:
    inputs:
      wait_seconds:
        description: '启动后观察多少秒再判定'
        required: false
        default: '90'
      device_name:
        description: '指定模拟器机型（留空自动选 iPhone）'
        required: false
        default: ''

concurrency:
  group: ios-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: com.hermes.memo

jobs:
  smoke:
    name: 启动冒烟
    # 必须 Apple Silicon：NodeMobile 只提供 arm64 模拟器切片，Intel runner 链接必失败
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 打印工具链
        run: |
          sw_vers
          xcodebuild -version
          echo "runner 架构：$(uname -m)"
          echo "可用模拟器运行时："
          xcrun simctl list runtimes | sed -n '1,12p'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: 缓存 NodeMobile.xcframework
        uses: actions/cache@v4
        with:
          path: ~/.cache/capawesome-capacitor-nodejs
          key: nodejs-mobile-24.5.0-capawesome.1

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验 NodeMobile 有模拟器切片
        run: |
          XCF=node_modules/@capawesome/capacitor-nodejs/ios/libnode/NodeMobile.xcframework
          if [ ! -d "$XCF" ]; then
            echo "::error::NodeMobile.xcframework 不存在，postinstall 没跑成功"
            exit 1
          fi
          plutil -p "$XCF/Info.plist" | grep -E 'LibraryIdentifier|SupportedPlatform' || true
          if ! plutil -p "$XCF/Info.plist" | grep -q 'simulator'; then
            echo "::error::这个 xcframework 没有模拟器切片"
            exit 1
          fi

      - name: 构建前端
        run: pnpm build

      - name: 同步到 iOS 工程
        run: npx cap sync ios

      - name: 补齐 Info.plist 权限
        run: node scripts/ios-setup.mjs

      - name: 构建模拟器 App（Debug）
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimDerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: 选一台模拟器并启动
        id: sim
        run: |
          set -euo pipefail
          # 选机逻辑在 scripts/pick_simulator.py：输出「UDID<TAB>机型名」
          PICKED=$(python3 scripts/pick_simulator.py --want "${{ github.event.inputs.device_name }}")
          IFS=$'\t' read -r DEVICE NAME <<< "$PICKED"
          echo "udid=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "选中：$NAME ($DEVICE)"
          echo "--- 全部候选 ---"
          python3 scripts/pick_simulator.py --list || true
          xcrun simctl boot "$DEVICE" || true     # 已 boot 会报错，忽略
          xcrun simctl bootstatus "$DEVICE" -b
          echo "模拟器已就绪"

      - name: 安装并启动 App，观察是否闪退
        id: launch
        run: |
          set -uo pipefail
          DEVICE="${{ steps.sim.outputs.udid }}"
          APP=build/SimDerivedData/Build/Products/Debug-iphonesimulator/App.app
          WAIT="${{ github.event.inputs.wait_seconds || '90' }}"
          mkdir -p build/smoke
          LOG=build/smoke/app-console.log
          CRASH_DIR="$HOME/Library/Logs/DiagnosticReports"
          # 用时间戳文件做「本次运行」的边界：模拟器崩溃报告会跨次累积，
          # 按秒数/月份去比会误伤上一次的记录（date -v 的 M 是月不是分）。
          touch build/smoke/.launch-stamp

          if [ ! -d "$APP" ]; then
            echo "::error::没有生成 App.app"
            find build/SimDerivedData/Build/Products -maxdepth 2 || true
            exit 1
          fi

          xcrun simctl install "$DEVICE" "$APP"
          echo "已安装到模拟器"

          # --console-pty 会把 App 进程的 stdout/stderr 接到这里。
          # Node 侧的 console.log 只能从这里拿到（它不走系统日志），
          # 所以这一项决定了能不能看到 [hermes-node] 的启动自检。
          xcrun simctl launch --terminate-running-process --console-pty "$DEVICE" "$BUNDLE_ID" > "$LOG" 2>&1 &
          LPID=$!
          # 注意：变量后面紧跟中文时必须用 ${VAR} 花括号。
          # bash 3.2 会把全角逗号/括号当成变量名的一部分，于是 "$LPID，" 会被解析成
          # 变量 LPID，→ set -u 下直接 unbound variable（第一次跑就踩到了）。
          echo "launch pid=${LPID}, 观察 ${WAIT}s"

          ALIVE=1
          for i in $(seq 1 "$WAIT"); do
            sleep 1
            if ! kill -0 "$LPID" 2>/dev/null; then
              ALIVE=0
              echo "::error::App 在启动后 ${i}s 内退出（闪退）"
              break
            fi
            # 每 15s 抓一张图，最后一张用于白屏判定，中间几张能看出卡在哪一屏
            if [ $((i % 15)) -eq 0 ]; then
              xcrun simctl io "$DEVICE" screenshot "build/smoke/shot-${i}s.png" >/dev/null 2>&1 || true
            fi
          done

          xcrun simctl io "$DEVICE" screenshot build/smoke/shot-final.png >/dev/null 2>&1 || true
          echo "alive=$ALIVE" >> "$GITHUB_OUTPUT"

          # ── 崩溃报告：本次启动之后新增的 .ips ──
          CRASHES=""
          if [ -d "$CRASH_DIR" ]; then
            CRASHES=$(find "$CRASH_DIR" -name '*.ips' -newer build/smoke/.launch-stamp 2>/dev/null \
              | grep -iE 'app|hermes' || true)
          fi
          if [ -n "$CRASHES" ]; then
            echo "::error::发现本次运行的崩溃报告："
            echo "$CRASHES"
            mkdir -p build/smoke/crashes
            cp $CRASHES build/smoke/crashes/ 2>/dev/null || true
          else
            echo "✓ 无崩溃报告"
          fi

          echo "--- App stdout 前 60 行 ---"
          head -60 "$LOG" || true

          # ── 判定：进程 + 崩溃 + Node 启动 + 首屏 ──
          FAILED=0
          [ "$ALIVE" = "1" ] || FAILED=1

          if grep -q '\[hermes-node\] Node.js runtime started' "$LOG"; then
            echo "✓ Node 运行时已启动"
            grep -m1 '\[hermes-node\] capabilities' "$LOG" || true
            if grep -q 'node:sqlite 不可用' "$LOG"; then
              echo "::error::node:sqlite 不可用，数据库相关功能会全部失败"
              FAILED=1
            fi
          else
            # 拿不到 stdout 不代表 App 坏了（可能 pty 不可用），只警告，靠截图兜底
            echo "::warning::stdout 里没有 [hermes-node] 标记，无法确认 Node 是否启动；以截图判定为准"
          fi

          python3 scripts/sim_screenshot_check.py build/smoke/shot-final.png || FAILED=$?

          # 收尾：先杀 console 会话，再关机
          kill "$LPID" 2>/dev/null || true
          xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" 2>/dev/null || true
          xcrun simctl shutdown "$DEVICE" 2>/dev/null || true

          if [ "$FAILED" != "0" ]; then
            echo "::error::冒烟测试未通过 (failed=${FAILED})"
            exit 1
          fi
          echo "✓ 冒烟测试通过"

      - name: 汇总结果
        if: always()
        run: |
          {
            echo "## iOS 模拟器冒烟测试"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 机型 | ${{ steps.sim.outputs.name }} |"
            echo "| UDID | \`${{ steps.sim.outputs.udid }}\` |"
            echo "| 观察时长 | ${{ github.event.inputs.wait_seconds || '90' }}s |"
            echo "| 进程存活 | ${{ steps.launch.outputs.alive == '1' && '是' || '否（闪退）' }} |"
            echo "| 结论 | ${{ job.status == 'success' && '通过' || '未通过，看上方日志与截图' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传现场（截图 / 日志 / 崩溃报告）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-evidence
          path: build/smoke/
          if-no-files-found: warn
          retention-days: 7
